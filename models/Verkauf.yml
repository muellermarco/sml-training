unique_name: Verkauf
object_type: model
label: Verkauf
metrics:
  - unique_name: Menge
  - unique_name: Auftragsbetrag
relationships:
  - unique_name: LINEITEM_L_SUPPKEY_to_Lieferant_Lieferantennummer
    from:
      dataset: LINEITEM
      join_columns:
        - L_SUPPKEY
    to:
      dimension: Lieferant
      level: Lieferantennummer
  - unique_name: LINEITEM_L_ORDERKEY_to_Auftrag_Auftragsnummer
    from:
      dataset: LINEITEM
      join_columns:
        - L_ORDERKEY
    to:
      dimension: Auftrag
      level: Auftragsnummer
  - unique_name: ORDERS_O_ORDERKEY_to_Auftrag_Auftragsnummer
    from:
      dataset: ORDERS
      join_columns:
        - O_ORDERKEY
    to:
      dimension: Auftrag
      level: Auftragsnummer
  - unique_name: LINEITEM_L_SHIPDATE_to_Datum_Datum
    from:
      dataset: LINEITEM
      join_columns:
        - L_SHIPDATE
    role_play: Versand {0}
    to:
      dimension: Datum
      level: Datum
